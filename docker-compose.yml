services:
  postgres:
    image: postgres:16-alpine
    container_name: mednexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mednexa
      POSTGRES_PASSWORD: mednexa_local_dev
      POSTGRES_DB: mednexa
    ports:
      - "5432:5432"
    volumes:
      - mednexa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mednexa -d mednexa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mednexa_pg_data:
